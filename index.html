<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>习惯打卡</title>
  <link rel="stylesheet" href="/MyWeb/styles.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>习惯打卡</h1>
        <p class="date" id="dateLabel"></p>
      </div>
      <div class="top-actions">
        <button
          class="theme-btn"
          id="themeBtn"
          type="button"
          aria-label="切换夜间模式"
          aria-pressed="false"
          title="切换夜间模式"
        >
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M20.4 13.1A8.5 8.5 0 1 1 10.9 3.6a7 7 0 0 0 9.5 9.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2" />
            <path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5 5l1.9 1.9M17.1 17.1L19 19M19 5l-1.9 1.9M6.9 17.1L5 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
        <div class="summary">
          <p class="summary-title">今日完成</p>
          <p class="summary-nums">
            <strong id="doneCount">0</strong>
            <span class="slash">/</span>
            <span id="totalCount">0</span>
            <span class="unit">项</span>
          </p>
        </div>
      </div>
    </header>

    <div class="progress" role="presentation">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <form class="add-bar" id="addForm">
      <input
        id="habitInput"
        type="text"
        maxlength="20"
        placeholder="添加习惯"
        autocomplete="off"
        aria-label="新习惯名称"
      />
      <label class="goal-field" for="goalInput">
        <input
          id="goalInput"
          type="number"
          min="1"
          max="99"
          value="1"
          inputmode="numeric"
          aria-label="每日目标次数"
        />
        <span>次/天</span>
      </label>
      <button class="add-btn" type="submit" aria-label="添加习惯" title="添加习惯">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
        </svg>
      </button>
    </form>

    <p class="feedback" id="feedback" role="status" aria-live="polite"></p>

    <ul class="habit-list" id="habitList"></ul>

    <div class="empty-state" id="emptyState">
      <span class="empty-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26">
          <path d="M4.5 12.5l5 5 10-11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </span>
      <p>还没有习惯</p>
    </div>

    <footer class="app-footer">
      <button class="clear-btn" id="clearBtn" type="button" aria-label="清空所有数据" title="清空所有数据">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
          <path d="M4 7h16M9 7V4h6v3m-9 0l1 13h10l1-13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        清空数据
      </button>
    </footer>
  </main>

  <div class="confirm-mask" id="goalMask" hidden>
    <div class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="goalTitle">
      <p class="confirm-title" id="goalTitle">每日目标</p>
      <p class="confirm-desc"><span id="goalHabitName"></span> 每天打算打卡几次？</p>
      <input
        class="goal-input"
        id="goalDialogInput"
        type="number"
        min="1"
        max="99"
        value="1"
        inputmode="numeric"
        aria-label="每日目标次数"
      />
      <div class="confirm-actions">
        <button class="btn-secondary" id="cancelGoal" type="button">取消</button>
        <button class="btn-primary" id="saveGoal" type="button">保存</button>
      </div>
    </div>
  </div>

  <div class="confirm-mask" id="confirmMask" hidden>
    <div class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <p class="confirm-title" id="confirmTitle">清空所有数据？</p>
      <p class="confirm-desc">这会删除全部习惯和每日打卡记录，且无法恢复。</p>
      <div class="confirm-actions">
        <button class="btn-secondary" id="cancelClear" type="button">取消</button>
        <button class="btn-danger" id="confirmClear" type="button">清空</button>
      </div>
    </div>
  </div>

  <script src="/MyWeb/app.js"></script>
</body>
</html>
